# Pyrefly configuration.
#
# Enforced in CI by the `Type check (pyrefly)` step in
# `.github/workflows/ci.yml`. The project is clean under the `default` preset
# with no error-kind suppressions, so the gate is simply `uv run pyrefly check`
# and exits non-zero on any new diagnostic.
#
# Why this file exists: without it, Pyrefly finds only `pyproject.toml` as a
# project marker, falls back to the `basic` preset, and the search-path
# heuristic picks `src/` as the "import root". That is wrong for this repo.
#
# Every project import is written workspace-root-relative with an explicit
# prefix -- `from src.…`, `from workers.…`, `from tests.…` -- so the workspace
# root is the import root, NOT `src/`. Leaving `src/` as the import root makes
# every `from src.…` import fail with `missing-import`.

# ---------------------------------------------------------------------------
# What to type check: the folders that hold *tracked* project code.
# `include`-style scoping means the workspace root is NOT implicit, so every
# folder must be listed -- an unlisted folder is silently unchecked.
#
# `.github/scripts` is listed explicitly and is the one deliberate exception to
# "no dot-directories": it holds `render_deploy_hook.py`, which `deploy.yml`
# executes as the production deploy gate. That makes it real, tracked project
# code rather than tooling, and its unit test in `tests/` was already covered
# while the script itself was not.
#
# Every other dot-directory stays unchecked, and this list is the whole reason:
# it is an allowlist, so nothing outside these four folders is read on its own
# behalf. `.agents/` (local MCP tooling) and the ~36 vendored scripts under the
# gitignored `.github/skills/` are therefore skipped simply by not being named.
# Modules those folders import are still *read* to supply types -- they are just
# never reported on. See `disable-project-excludes-heuristics` for why this
# allowlist, and not the exclude list, is what draws the boundary.
# ---------------------------------------------------------------------------
project-includes = ["src", "tests", "workers", ".github/scripts"]

# Most of this list duplicates Pyrefly's own defaults on purpose: see
# `disable-project-excludes-heuristics` below, which switches those defaults
# off and makes this list the *only* source of excludes. `**/venv/**` in
# particular is copied from the defaults because turning them off would
# otherwise drop it. The site-packages path from `python-interpreter-path` is
# always excluded separately, whatever this list says.
project-excludes = [
    "**/.venv",
    "**/venv/**",
    "**/env",
    "**/node_modules",
    "**/build",
    "**/dist",
    "**/__pycache__",
]

# ---------------------------------------------------------------------------
# Required for the `.github/scripts` entry above -- do not remove it without
# also removing that entry.
#
# Pyrefly filters dot-directories out at its glob layer, which outranks
# `project-includes`: naming `.github/scripts` while the heuristics are on just
# produces `WARN Skipping include pattern ... because it is matched by
# `project-excludes` or an ignore file`, and `render_deploy_hook.py` is silently
# left unchecked. Turning the heuristics off drops that filter, so the explicit
# include takes effect. Verified by planting a type error in the script: it is
# reported with this flag set and missed without it.
#
# The cost is that the defaults listed above stop being applied, hence copying
# `**/venv/**` into `project-excludes`. Scope stays exact either way, because
# `project-includes` is an allowlist: disabling heuristics widens nothing beyond
# the four folders named there (verified: 284 modules = src 165 + tests 106 +
# workers 12 + .github/scripts 1, and no `.agents/`, `.github/skills/`, `.venv`
# or `node_modules` entry).
# ---------------------------------------------------------------------------
disable-project-excludes-heuristics = true

# ---------------------------------------------------------------------------
# Where imports resolve from. The workspace root ("." relative to this file)
# is what makes `from src.…` / `from workers.…` / `from tests.…` resolve.
# ---------------------------------------------------------------------------
search-path = ["."]

# ---------------------------------------------------------------------------
# Python environment. The project targets Python >= 3.14 (see pyproject.toml
# and .python-version) and the interpreter below is the project venv, which is
# what supplies third-party types (fastapi, sqlalchemy, stripe, ...).
# ---------------------------------------------------------------------------
python-interpreter-path = ".venv/bin/python"
python-version = "3.14"
python-platform = "linux"

# The `default` preset (Pyrefly's own defaults): no error kind is disabled and
# no severity is downgraded. A new error kind that Pyrefly enables by default
# will therefore surface here first, which is intentional — the alternative is a
# config that silently drifts away from what the checker actually knows.
#
# If a *future* preset bump produces a large batch of unrelated diagnostics,
# prefer fixing them or adding a narrowly-scoped `[[sub-config]]` for the path
# in question over disabling the kind project-wide.
preset = "default"
