events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=guest:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Upstream for API
    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # ISO 27001 A.8.20 (network security) / A.8.26 (application security).
        # Redirect HTTP to HTTPS is enforced at the load balancer / TLS terminator;
        # add these headers here as defense-in-depth for the SPA/API responses.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # CSP for the built SPA (inline styles required by Tailwind/Vite).
        # connect-src must include the object-store host so cross-origin
        # presigned uploads (PUT to Backblaze B2 / S3) are not blocked.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://s3.us-east-005.backblazeb2.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Max upload size: 1GB
        client_max_body_size 1024M;

        # Health check - no rate limit
        location /health {
            limit_req zone=guest nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ready {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Guest endpoints - strict rate limit
        location /api/v1/conversions/guest {
            limit_req zone=guest burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other API endpoints - apply the API zone limit as a coarse
        # edge-level backstop (app-level middleware enforces tier/per-key limits)
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for real-time progress
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Long-lived SSE connections (progress streams) and large uploads
            # need generous timeouts; default Nginx 60s would cut them off.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
            proxy_connect_timeout 30s;
        }
    }
}
