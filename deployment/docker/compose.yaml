# ============================================================================
# LOCAL DEVELOPMENT compose stack.
#
# `version:` was removed: it is obsolete in Compose v2 and warns on every
# invocation.
#
# BEFORE THIS STACK IS USED ANYWHERE BUT A TRUSTED LOCAL MACHINE, the following
# must be tightened (recorded here deliberately rather than left as an
# oversight):
#
#   1. Credentials — `POSTGRES_PASSWORD`, `MINIO_ROOT_USER/PASSWORD` are
#      hardcoded below. Move them to env vars / a secret store. Do NOT bake
#      them into the images.
#   2. Port publishing — `postgres:5432`, `redis:6379`, `minio:9000/9001`,
#      `api:8000` and `nginx:80` are bound to 0.0.0.0. Bind datastores to
#      `127.0.0.1:` (or drop the mapping entirely) so they are not exposed on a
#      shared network.
#   3. Resource limits — no `mem_limit`/`cpus` are set, so one pathological
#      conversion (e.g. a PDF fanned out to per-page images) can OOM the host.
#      Worker containers should have explicit memory limits + an OOM policy.
#   4. Healthchecks — the `worker` and `worker-cleanup` services have none, so
#      a wedged worker looks healthy to `docker ps`.
#   5. `uv run` at container start re-syncs dependencies from the network (see
#      worker.Dockerfile) — a runtime dependency for a production image.
#
# `stop_grace_period` on the worker services is intentionally longer than
# WORKER_CONVERSION_TIMEOUT (600s) so `docker stop` / `restart: unless-stopped`
# lets the in-flight job finish and ACK instead of SIGKILLing it mid-conversion.
# A job killed anyway is recovered by the worker's stale-pending reclaim sweep.
# ============================================================================

services:
  api:
    build:
      context: ../../
      dockerfile: deployment/docker/worker.Dockerfile
    container_name: transform-api
    command: uv run uvicorn src.presentation.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - converter-net
    restart: unless-stopped

  worker:
    build:
      context: ../../
      dockerfile: deployment/docker/worker.Dockerfile
    command: uv run python -m workers.converter_workers.main
    # PRODUCTION converter workers (replicas 1..3).
    #
    # `.env` describes the local DEVELOPMENT environment, and this replica set
    # deliberately runs against production, so a second env file overrides it.
    # Compose merges env files in order and later entries win:
    #
    #   DATABASE_URL        -> the production database, so production jobs are
    #                          persisted (and credits consumed) in the database
    #                          the deployed API reads.
    #   QUEUE_STREAM_PREFIX -> forced EMPTY, so these workers consume the real
    #                          (unprefixed) production streams. Inheriting the
    #                          `dev:` prefix from `.env` would leave them idle
    #                          while the dev streams drained.
    #
    # The override file is gitignored (like `.env`); its tracked template is
    # `.env.production-workers.example` beside this compose file.
    env_file:
      - ../../.env
      - .env.production-workers
    # Worker connects directly to cloud services via .env (Neon Postgres,
    # Upstash Redis, Backblaze B2) — no local infra required.
    networks:
      - converter-net
    restart: unless-stopped
    # Above WORKER_CONVERSION_TIMEOUT (600s): let the in-flight job finish and
    # ACK rather than SIGKILLing it mid-conversion.
    stop_grace_period: 15m
    deploy:
      replicas: 3

  worker-dev:
    # Reuses the image built by the `worker` service (identical Dockerfile and
    # context) instead of declaring its own build, so adding a development
    # replica does not duplicate a multi-GB image. Build it first:
    #     docker compose -f deployment/docker/compose.yaml build worker
    image: docker-worker
    container_name: transform-worker-dev
    command: uv run python -m workers.converter_workers.main
    # The DEVELOPMENT converter worker. Takes DATABASE_URL and
    # QUEUE_STREAM_PREFIX straight from `.env` — the development database and
    # the `dev:` stream namespace — so it only ever consumes jobs the local dev
    # API published and never touches production rows.
    env_file:
      - ../../.env
    networks:
      - converter-net
    restart: unless-stopped
    stop_grace_period: 15m
    deploy:
      replicas: 1

  worker-cleanup:
    build:
      context: ../../
      dockerfile: deployment/docker/worker.Dockerfile
    container_name: transform-cleanup
    command: uv run python -m workers.cleanup_worker.main
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - converter-net
    restart: unless-stopped
    # Let the in-flight cleanup cycle finish; the cycle is re-run on restart so
    # an interrupted one is not lost work.
    stop_grace_period: 5m

  postgres:
    image: postgres:15-alpine
    container_name: transform-postgres
    environment:
      POSTGRES_USER: transform
      POSTGRES_PASSWORD: transform_secret
      POSTGRES_DB: transform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - converter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: transform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - converter-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: transform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - converter-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: transform-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - converter-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  converter-net:
    driver: bridge