<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab-bar icon. SVG for modern browsers, ICO for legacy browsers and
         pinned/bookmark bars, a PNG for older Safari, and a full-bleed PNG for
         iOS home-screen saves. All absolute so they resolve from any route.

         The `?v=` suffix is deliberate: browsers cache favicons far more
         aggressively than normal assets and frequently ignore Cache-Control,
         so a plain reload keeps showing the old icon. Changing the URL is the
         only reliable way to force a refresh — BUMP `v` WHENEVER THE LOGO
         CHANGES. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transform — convert files between formats with a live queue, real-time progress, and no sign-up required." />
    <meta name="theme-color" content="#121417" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Transform — File Converter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
