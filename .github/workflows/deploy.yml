name: Deploy

# Deployment is triggered by a push to `main` — the final production branch.
#
# Promotion flow:
#   dev  ->  staging  ->  main
#   (implementation)  (testing)   (final production)
#
# The full CI suite is re-run on the exact commit being shipped before any
# deploy hook fires, so a deploy can never proceed on failing tests.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never run two production deploys at once; never cancel one mid-flight.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: reuse the CI workflow on the exact commit being deployed.
  # ---------------------------------------------------------------------------
  verify:
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Production deployment.
  # ---------------------------------------------------------------------------
  production:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - name: Trigger production deploy
        env:
          # Add a repository/environment secret named RENDER_PROD_DEPLOY_HOOK.
          DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_PROD_DEPLOY_HOOK is not configured."
            echo "Create a deploy hook in Render and add it as a repository secret."
            exit 1
          fi
          echo "Triggering production deploy for ${GITHUB_SHA}..."
          curl -fsS -X POST "$DEPLOY_HOOK"
